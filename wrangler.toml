name = "mrrgong"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# Secrets: wrangler secret put STRIPE_WEBHOOK_SECRET / DISCORD_WEBHOOK_URL / SLACK_WEBHOOK_URL
[vars]
GONG_BIG_AT = "100"
GONG_HUGE_AT = "1000"

# Keeps dedupe keys and milestone counters across isolates. Create it with
# `npx wrangler kv namespace create GONG_KV`, then uncomment and paste the id.
# [[kv_namespaces]]
# binding = "GONG_KV"
# id = "<your-kv-namespace-id>"
