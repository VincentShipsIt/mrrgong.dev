name: Mac app
on:
  push:
    branches: [main]
    paths: ["apps/mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["apps/mac/**", ".github/workflows/mac.yml"]
jobs:
  swift-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
